name: integration_tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23.4"

      - name: Run Integration Tests
        run: go test -v ./... -tags=integration
